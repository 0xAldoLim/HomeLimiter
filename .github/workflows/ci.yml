name: HomeLimiter validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  controller:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check src tests scripts
      - run: python -m ruff format --check src tests scripts
      - run: python -m pytest -q --junitxml=test-results/controller.xml
      - run: python -m build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: controller-${{ matrix.os }}-${{ matrix.python }}
          path: test-results/
  launchers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fresh Linux startup and reuse
        if: runner.os == 'Linux'
        shell: bash
        run: |
          first="$(./run.sh --home "$RUNNER_TEMP/launcher" --demo check)"
          [[ "$first" == *"Installing HomeLimiter dependencies"* ]]
          second="$(./run.sh --home "$RUNNER_TEMP/launcher" --demo devices)"
          [[ "$second" != *"Installing HomeLimiter dependencies"* && "$second" == *'"demo-2"'* ]]
          .venv/bin/python -m pip check
      - name: Fresh Windows startup and reuse
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $state = Join-Path $env:RUNNER_TEMP 'launcher'
          $first = .\run.ps1 --home $state --demo check | Out-String
          if ($LASTEXITCODE -ne 0 -or $first -notmatch 'Installing HomeLimiter dependencies') { throw $first }
          $second = .\run.ps1 --home $state --demo devices | Out-String
          if ($LASTEXITCODE -ne 0 -or $second -match 'Installing HomeLimiter dependencies' -or $second -notmatch '"demo-2"') { throw $second }
          .\.venv\Scripts\python.exe -m pip check
  isolated-network:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -e . pytest
      - run: sudo apt-get update && sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y iproute2 nftables iperf3 iputils-ping
      - name: Load optional test kernel modules
        run: |
          for module in ifb sch_htb sch_fq_codel cls_flower cls_matchall act_mirred; do
            sudo modprobe "$module" || true
          done
      - name: Verify only inside disposable namespaces
        run: sudo env HOMELIMITER_NET_TESTS=1 .venv/bin/python -m pytest tests/test_network.py -q -s --junitxml=test-results/network.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-network
          path: test-results/
