name: HomeLimiter validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  controller:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check src tests
      - run: python -m ruff format --check src tests
      - run: python -m pytest -q --junitxml=test-results/controller.xml
      - run: python -m build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: controller-${{ matrix.os }}-${{ matrix.python }}
          path: test-results/
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest tests/test_browser.py tests/test_dashboard_states.py -q --junitxml=test-results/browser.xml
        env:
          HOMELIMITER_BROWSER_TESTS: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser
          path: test-results/
  isolated-network:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -e . pytest
      - run: sudo apt-get update && sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y iproute2 nftables iperf3 iputils-ping
      - name: Load optional test kernel modules
        run: |
          for module in ifb sch_htb sch_fq_codel cls_flower cls_matchall act_mirred; do
            sudo modprobe "$module" || true
          done
      - name: Verify only inside disposable namespaces
        run: sudo env HOMELIMITER_NET_TESTS=1 .venv/bin/python -m pytest tests/test_network.py -q -s --junitxml=test-results/network.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-network
          path: test-results/
